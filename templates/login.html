<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Cardápio Hospitalar</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
<main class="login-wrap">
  <section class="login-card">
    <h1>Cardápio Hospitalar</h1>
    <p class="sub">Acesse com seu e-mail e senha.</p>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, msg in mensagens %}
        <div class="flash flash-{{ categoria }}" role="alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autofocus autocomplete="username">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>
  </section>
</main>
</body>
</html>
