<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes — NutriClin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/identidade_paginas.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/identidade_pacientes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/identidade_navbar.css') }}">
</head>
<body>
    {% from 'admin/_navbar_standalone.html' import navbar with context %}
    {{ navbar(admin) }}

    <main class="content">
        <div class="page-head">
            <div class="page-title">
                <h1>Pacientes</h1>
                <p>Gerencie os pacientes para otimização de cardápios.</p>
            </div>
            <a href="/pacientes/novo" class="btn btn-primary btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 4v16m8-8H4"/>
                </svg>
                Novo Paciente
            </a>
        </div>

        <!-- Lista -->
        <div id="listaPacientes"></div>
        <div id="listaVazia" class="lista-vazia hidden">
            <p>Nenhum paciente cadastrado.</p>
            <a href="/pacientes/novo">Cadastrar primeiro paciente →</a>
        </div>
    </main>

    <script>
        async function carregarLista() {
            try {
                const res = await fetch('/api/pacientes');
                const pacientes = await res.json();
                const container = document.getElementById('listaPacientes');
                const vazia = document.getElementById('listaVazia');

                if (!pacientes.length) {
                    vazia.classList.remove('hidden');
                    container.innerHTML = '';
                    return;
                }

                vazia.classList.add('hidden');
                container.innerHTML = pacientes.map(p => `
                    <div class="card-paciente">
                        <div class="paciente-info">
                            <h3 class="paciente-nome">${p.nome}</h3>
                            <div class="paciente-meta">
                                ${p.peso_kg ? `<span>Peso: <b>${p.peso_kg} kg</b></span>` : ''}
                                ${p.altura_cm ? `<span>Altura: <b>${p.altura_cm} cm</b></span>` : ''}
                                ${p.imc ? `<span>IMC: <b>${p.imc}</b></span>` : ''}
                                <span>Objetivo: <b>${p.objetivo === 'ganhar' ? 'Ganhar Peso' : p.objetivo === 'perder' ? 'Perder Peso' : 'Manter'}</b></span>
                            </div>
                            ${p.observacoes ? `<p class="paciente-obs">${p.observacoes}</p>` : ''}
                        </div>
                        <div class="paciente-acoes">
                            <a href="/pacientes/${p.id}/planos" class="btn-planos">Planos</a>
                            <a href="/pacientes/${p.id}/editar" class="btn-edit">Editar</a>
                            <button onclick="removerPaciente(${p.id}, '${p.nome}')" class="btn-remove">Remover</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function removerPaciente(id, nome) {
            if (!confirm(`Remover paciente "${nome}"?`)) return;
            try {
                const res = await fetch(`/api/pacientes/${id}`, { method: 'DELETE' });
                if (res.ok) carregarLista();
            } catch (e) {
                alert('Erro ao remover paciente.');
            }
        }

        carregarLista();
    </script>
</body>
</html>
