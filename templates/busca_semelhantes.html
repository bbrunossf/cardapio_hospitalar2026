<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca de Alimentos Semelhantes</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/identidade_paginas.css') }}">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .entrada {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  #txtQuery { flex: 1; min-width: 220px; padding: 8px 10px; font-size: 0.9rem; }
  .entrada label { font-size: 0.78rem; color: var(--text2); display: inline-flex; align-items: center; gap: 6px; }
  .entrada select {
    font-family: var(--font); font-size: 0.82rem; color: var(--text);
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  #msgErro { color: var(--danger); font-size: 0.8rem; width: 100%; }

  #resultado { flex: 1; overflow-y: auto; padding: 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .card h3 { font-size: 0.85rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 10px; }
  .resultado-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .resultado-nome { font-size: 1.1rem; font-weight: 700; }
  .badge-tipo {
    display: inline-block; background: #E3EDF7; color: #1F4E79; font-size: 0.7rem;
    font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle;
  }
  .distancia { font-size: 0.78rem; color: var(--text2); }
  .kcal { font-size: 0.85rem; font-weight: 600; color: var(--primary); }
  .texto-semantico { font-size: 0.85rem; color: var(--text2); margin-top: 8px; line-height: 1.5; }
  .vazio { color: var(--text2); font-size: 0.9rem; padding: 12px 0; }
  .carregando { color: var(--text2); font-size: 0.9rem; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    Alimentos Semelhantes
  </h1>
  <a class="voltar" href="/admin/">&larr; Voltar ao Admin</a>
</header>

<div class="entrada">
  <input type="text" id="txtQuery" placeholder="Busca por texto livre (ex.: fruta tropical, bolo de chocolate, rico em proteína)" autofocus>
  <label>Resultados
    <select id="selTopK">
      <option value="3" selected>3</option>
      <option value="5">5</option>
      <option value="10">10</option>
    </select>
  </label>
  <button class="btn btn-primary" id="btnBuscar">Buscar</button>
  <div id="msgErro"></div>
</div>

<div id="resultado">
  <div class="vazio">Digite um texto e clique em Buscar para encontrar os alimentos mais semelhantes no banco.</div>
</div>

<script src="{{ url_for('static', filename='js/busca_semelhantes.js') }}"></script>
</body>
</html>
