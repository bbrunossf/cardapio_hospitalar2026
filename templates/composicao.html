<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Técnica das Preparações</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/identidade_paginas.css') }}">
<style>
  /* Print: ficha limpa, sem controles de edição */
  @media print {
    body { background: #fff; }
    header .voltar, .panel-left, .search-box, .stats-bar,
    .btn, .saved-msg, .empty-state, .add-ingrediente-box { display: none !important; }
    .container { display: block !important; }
    .panel-right { width: 100% !important; padding: 0 !important; }
    .prato-detail { box-shadow: none !important; border: none !important; }
    input[type="number"], input[type="text"] {
      border: none !important; background: transparent !important;
      font-weight: 600; color: #000 !important;
    }
    .nutri-grid { display: grid !important; }
  }

  /* Ícones externos (lucide) — dimensões por contexto */
  header h1 svg { width: 24px; height: 24px; }
  .empty-state .icon svg { width: 48px; height: 48px; }
  .status svg { width: 16px; height: 16px; }
  .prato-detail h4 svg { width: 16px; height: 16px; color: var(--primary); }
  .saved-msg svg, .btn svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<header>
  <h1>
    {% include 'icons/utensils.svg' %}
    Ficha Técnica das Preparações
  </h1>
  <a class="voltar" href="/admin/">&larr; Voltar ao Admin</a>
</header>
<div class="container">
  <div class="panel-left">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar prato..." oninput="filtrarPratos()">
    </div>
    <div class="prato-list" id="pratoList">
      <div class="loading">Carregando pratos</div>
    </div>
    <div class="stats-bar" id="statsBar"></div>
  </div>
  <div class="panel-right" id="panelRight">
    <div class="empty-state">
      <div class="icon">
        {% include 'icons/arrow-left.svg' %}
      </div>
      <p>Selecione um prato na lista ao lado<br>para ver a ficha técnica</p>
    </div>
  </div>
</div>
<script>
let pratos = [];
let pratoAtivo = null;
let ingredientesCache = {};

function escAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function carregarPratos() {
  const r = await fetch('/api/pratos');
  pratos = await r.json();
  document.getElementById('statsBar').textContent = `${pratos.length} pratos cadastrados`;
  renderPratos(pratos);
}

function renderPratos(lista) {
  const el = document.getElementById('pratoList');
  if (lista.length === 0) {
    el.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text2);">Nenhum prato encontrado</div>';
    return;
  }
  el.innerHTML = lista.map(p => {
    let badge = '<span class="badge empty">sem composição</span>';
    if (p.qtd_ingredientes > 0) {
      const diff = Math.abs(parseFloat(p.massa_total || 0) - parseFloat(p.porcao_padrao_g || 0));
      badge = diff < 0.01
        ? '<span class="badge ok">ok</span>'
        : `<span class="badge warn">dif ${diff.toFixed(1)}g</span>`;
    }
    return `<div class="prato-item${pratoAtivo === p.id ? ' active' : ''}" onclick="selecionarPrato(${p.id})" data-nome="${p.nome.toLowerCase()}">
      <div><div class="nome">${p.nome}</div><div class="tipo">${p.tipo || ''}</div></div>
      ${badge}
    </div>`;
  }).join('');
}

function filtrarPratos() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtrados = pratos.filter(p => p.nome.toLowerCase().includes(q));
  renderPratos(filtrados);
}

async function selecionarPrato(id) {
  pratoAtivo = id;
  renderPratos(pratos);

  const panel = document.getElementById('panelRight');
  panel.innerHTML = '<div class="loading">Carregando ficha técnica</div>';

  const r = await fetch(`/api/pratos/${id}/composicao`);
  const data = await r.json();

  if (data.error) {
    panel.innerHTML = `<div class="empty-state"><p>${data.error}</p></div>`;
    return;
  }

  renderComposicao(data);
}

function renderComposicao(data) {
  const { prato, ingredientes, modo_preparo, nutrientes, massa_calculada, diferenca, ok } = data;
  const porcao = parseFloat(prato.porcao_padrao_g || 0);
  const temComposicao = massa_calculada > 0;

  const statusClass = ok ? 'ok' : 'warn';
  const statusIcon = ok
    ? `{% include 'icons/check.svg' %}`
    : `{% include 'icons/triangle-alert.svg' %}`;
  const statusText = ok ? 'Massas coincidem' : `Diferença de ${Math.abs(diferenca).toFixed(1)}g`;

  // Resumo nutricional por porção (read-only)
  const fmt = (v, d = 1) => temComposicao ? (v ?? 0).toFixed(d) : '—';
  const nutriCards = [
    ['Energia', 'kcal', fmt(nutrientes.energia_kcal, 0)],
    ['Proteína', 'g', fmt(nutrientes.proteina_g)],
    ['Carboidratos', 'g', fmt(nutrientes.carboidrato_g)],
    ['Lipídios', 'g', fmt(nutrientes.lipidios_g)],
    ['Fibra', 'g', fmt(nutrientes.fibra_alimentar_g)],
    ['Sódio', 'mg', fmt(nutrientes.sodio_mg, 0)],
    ['Potássio', 'mg', fmt(nutrientes.potassio_mg, 0)],
  ].map(([label, unid, val]) => `
    <div style="background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; text-align:center;">
      <div style="font-size:1.05rem; font-weight:600; color:var(--primary);">${val}</div>
      <div style="font-size:0.75rem; color:var(--text2);">${label} (${unid})</div>
    </div>`).join('');

  // Passos do modo de preparo
  const passosHtml = (modo_preparo || []).map(passo => `
    <div class="passo-row" style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
      <span style="font-weight:600; color:var(--primary); min-width:22px; text-align:right;">${passo.ordem}.</span>
      <input type="text" id="passo_${passo.id}" value="${escAttr(passo.descricao)}"
             style="flex:1; padding:8px 12px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.9rem; outline:none; font-family:var(--font);">
      <button class="btn btn-primary btn-sm" onclick="salvarPasso(${passo.id})">Salvar</button>
      <span class="saved-msg" id="savedPasso_${passo.id}">
        {% include 'icons/check.svg' %}
      </span>
      <button class="btn btn-sm btn-danger" onclick="removerPasso(${passo.id})">
        {% include 'icons/x.svg' %}
      </button>
    </div>`).join('');

  const panel = document.getElementById('panelRight');
  panel.innerHTML = `
    <div class="prato-detail">
      <h2>${prato.nome}</h2>
      <div class="subtitulo">${prato.tipo || ''} &middot; ${prato.consistencia || '—'} &middot; ${prato.temperatura_servimento || '—'}</div>

      <div style="display:flex; gap:24px; flex-wrap:wrap; margin-bottom:16px;">
        <div class="porcao-row" style="flex:1; min-width:220px;">
          <label>Porção padrão (g)</label>
          <input type="number" step="0.5" id="porcaoInput" value="${porcao}" onchange="salvarPorcao(${prato.id})">
          <div class="status ${statusClass}">
            <span>${statusIcon}</span>
            <span class="diferenca">${massa_calculada.toFixed(1)}g calculados</span>
            <span>— ${statusText}</span>
          </div>
          <button class="btn btn-primary btn-sm" onclick="salvarPorcao(${prato.id})">Salvar</button>
          <span class="saved-msg" id="porcaoSaved">
            {% include 'icons/check.svg' %} salvo
          </span>
        </div>
        <div class="tempo-row" style="flex:1; min-width:220px;">
          <label>Tempo de preparo (min)</label>
          <input type="number" min="0" step="1" id="tempoInput" value="${prato.tempo_producao_min ?? ''}" placeholder="—" onchange="salvarPreparo(${prato.id})">
          <button class="btn btn-primary btn-sm" onclick="salvarPreparo(${prato.id})">Salvar</button>
          <span class="saved-msg" id="tempoSaved">
            {% include 'icons/check.svg' %} salvo
          </span>
        </div>
      </div>

      <table>
        <thead>
          <tr><th>Ingrediente</th><th style="width:120px;text-align:center;">Quantidade (g)</th><th style="width:140px;"></th></tr>
        </thead>
        <tbody>
          ${ingredientes.map(ing => `
            <tr>
              <td class="ingrediente-nome">${ing.ingrediente}</td>
              <td style="text-align:center;">
                <input type="number" step="0.5" id="qtd_${ing.ingrediente_id}" value="${parseFloat(ing.quantidade_g).toFixed(1)}"
                       onchange="salvarComposicao(${prato.id}, ${ing.ingrediente_id})">
              </td>
              <td>
                <button class="btn btn-primary btn-sm" onclick="salvarComposicao(${prato.id}, ${ing.ingrediente_id})">Salvar</button>
                <span class="saved-msg" id="saved_${ing.ingrediente_id}">
                  {% include 'icons/check.svg' %}
                </span>
                <button class="btn btn-sm btn-danger" style="margin-left:4px;" onclick="removerIngrediente(${prato.id}, ${ing.ingrediente_id}, '${ing.ingrediente}')">
                  {% include 'icons/x.svg' %}
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr class="total-row">
            <td><strong>Total</strong></td>
            <td style="text-align:center;"><strong>${massa_calculada.toFixed(1)}g</strong></td>
            <td></td>
          </tr>
        </tfoot>
      </table>

      <div class="add-ingrediente-box" style="margin-top: 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
        <h4 style="margin-bottom: 12px; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;">
          {% include 'icons/plus.svg' %}
          Adicionar Ingrediente
        </h4>
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <input type="text" id="addIngSearch" placeholder="Buscar ingrediente..." oninput="filtrarIngredientesDisponiveis()"
                 style="flex:1; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; outline: none; font-family: var(--font);">
          <input type="number" id="addIngQtd" value="10" step="0.5" min="0.5"
                 style="width: 80px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); text-align: center; font-size: 0.9rem; outline: none; font-family: var(--font);">
          <span style="color:var(--text2); display:flex; align-items:center; font-size:0.85rem;">g</span>
        </div>
        <div id="ingredientesDisponiveis" style="max-height: 200px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 4px;">
          <div style="color: var(--text2); font-size: 0.85rem; padding: 8px;">Carregando...</div>
        </div>
      </div>

      <div style="margin-top: 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
        <h4 style="margin-bottom: 12px; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;">
          {% include 'icons/chef-hat.svg' %}
          Modo de Preparo
        </h4>
        <div id="passosList">
          ${passosHtml || '<div style="color:var(--text2); font-size:0.85rem; padding:4px;">Nenhum passo cadastrado</div>'}
        </div>
        <div style="display: flex; gap: 8px; margin-top: 12px;">
          <input type="text" id="novoPassoInput" placeholder="Novo passo..."
                 style="flex:1; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; outline: none; font-family: var(--font);">
          <button class="btn btn-primary btn-sm" onclick="adicionarPasso(${prato.id})">+ Adicionar passo</button>
        </div>
      </div>

      <div style="margin-top: 24px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
        <h4 style="margin-bottom: 12px; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;">
          {% include 'icons/flame.svg' %}
          Valores Nutricionais por Porção
        </h4>
        <div class="nutri-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px;">
          ${temComposicao ? nutriCards : '<div style="color:var(--text2); font-size:0.85rem; padding:4px;">Sem composição cadastrada</div>'}
        </div>
      </div>
    </div>
  `;
  filtrarIngredientesDisponiveis();
}

async function salvarPorcao(pratoId) {
  const input = document.getElementById('porcaoInput');
  const val = input.value;
  const r = await fetch(`/api/pratos/${pratoId}/porcao`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ porcao_padrao_g: val })
  });
  const data = await r.json();
  if (data.success) {
    const msg = document.getElementById('porcaoSaved');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
    // Recarrega para mostrar status atualizado
    selecionarPrato(pratoId);
    carregarPratos(); // atualiza lista
  }
}

async function salvarPreparo(pratoId) {
  const input = document.getElementById('tempoInput');
  const val = input.value;
  const r = await fetch(`/api/pratos/${pratoId}/preparo`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ tempo_producao_min: val === '' ? null : parseInt(val, 10) })
  });
  const data = await r.json();
  if (data.success) {
    const msg = document.getElementById('tempoSaved');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  } else {
    alert(data.error || 'Erro ao salvar tempo de preparo');
  }
}

async function adicionarPasso(pratoId) {
  const input = document.getElementById('novoPassoInput');
  const descricao = input.value.trim();
  if (!descricao) return;
  const r = await fetch(`/api/pratos/${pratoId}/modo-preparo`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ descricao })
  });
  if (r.ok) {
    selecionarPrato(pratoId);
  } else {
    const err = await r.json();
    alert(err.error || 'Erro ao adicionar passo');
  }
}

async function salvarPasso(passoId) {
  const input = document.getElementById(`passo_${passoId}`);
  const descricao = input.value.trim();
  if (!descricao) {
    alert('Descrição do passo não pode ser vazia');
    return;
  }
  const r = await fetch(`/api/modo-preparo/${passoId}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ descricao })
  });
  if (r.ok) {
    const msg = document.getElementById(`savedPasso_${passoId}`);
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  } else {
    const err = await r.json();
    alert(err.error || 'Erro ao salvar passo');
  }
}

async function removerPasso(passoId) {
  const input = document.getElementById(`passo_${passoId}`);
  const descricao = input ? input.value : '';
  if (!confirm(`Remover o passo "${descricao}"?`)) return;
  const r = await fetch(`/api/modo-preparo/${passoId}`, {
    method: 'DELETE'
  });
  if (r.ok) {
    selecionarPrato(pratoAtivo);
  } else {
    const err = await r.json();
    alert(err.error || 'Erro ao remover passo');
  }
}

async function salvarComposicao(pratoId, ingredienteId) {
  const input = document.getElementById(`qtd_${ingredienteId}`);
  const val = input.value;
  const r = await fetch(`/api/composicao/${pratoId}/${ingredienteId}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ quantidade_g: val })
  });
  const data = await r.json();
  if (data.success) {
    const msg = document.getElementById(`saved_${ingredienteId}`);
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
    // Recarrega para recalcular massas
    selecionarPrato(pratoId);
    carregarPratos(); // atualiza lista
  }
}

let todosIngredientes = [];

async function carregarIngredientes() {
  const r = await fetch('/api/ingredientes');
  todosIngredientes = await r.json();
}

function filtrarIngredientesDisponiveis() {
  if (!pratoAtivo || !todosIngredientes.length) return;
  const q = document.getElementById('addIngSearch').value.toLowerCase();
  const idsNoPrato = new Set(
    Array.from(document.querySelectorAll('.prato-detail table tbody tr')).map(tr => {
      const btn = tr.querySelector('button.btn-danger');
      if (btn) {
        const match = btn.getAttribute('onclick').match(/removerIngrediente\((\d+), (\d+)/);
        return match ? parseInt(match[2]) : null;
      }
      return null;
    }).filter(Boolean)
  );
  const disponiveis = todosIngredientes.filter(i =>
    !idsNoPrato.has(i.id) && i.nome.toLowerCase().includes(q)
  ).slice(0, 100);
  const el = document.getElementById('ingredientesDisponiveis');
  if (disponiveis.length === 0) {
    el.innerHTML = '<div style="color:var(--text2);font-size:0.85rem;padding:4px;">Nenhum ingrediente disponível</div>';
    return;
  }
  el.innerHTML = disponiveis.map(i =>
    `<button class="btn btn-sm" style="background:var(--surface2);color:var(--text);margin:2px;white-space:nowrap;"
            onclick="adicionarIngrediente(${pratoAtivo}, ${i.id}, '${i.nome.replace(/'/g, "\\'")}')">
       ${i.nome}
     </button>`
  ).join('');
}

async function adicionarIngrediente(pratoId, ingredienteId, nome) {
  const qtd = parseFloat(document.getElementById('addIngQtd').value) || 10;
  const r = await fetch(`/api/composicao/${pratoId}/add/${ingredienteId}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ quantidade_g: qtd })
  });
  if (r.ok) {
    selecionarPrato(pratoId);
    carregarPratos();
  } else {
    const err = await r.json();
    alert(err.error || 'Erro ao adicionar ingrediente');
  }
}

async function removerIngrediente(pratoId, ingredienteId, nome) {
  if (!confirm(`Remover "${nome}" do prato?`)) return;
  const r = await fetch(`/api/composicao/${pratoId}/${ingredienteId}`, {
    method: 'DELETE'
  });
  if (r.ok) {
    selecionarPrato(pratoId);
    carregarPratos();
  }
}

carregarPratos();
carregarIngredientes();
</script>
</body>
</html>
